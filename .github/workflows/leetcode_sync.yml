name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'solutions'
          structure-with-difficulty: true
          # Maps LeetCode naming conventions to strict file extensions
          custom-ext: |
            python3: 'py'
            python: 'py'
            java: 'java'
            cpp: 'cpp'
            javascript: 'js'
            typescript: 'ts'
